<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>RJL Admin — Boom Gate</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0f1117; --card:#1a1d27; --key:#232636; --border:#2c2f3e;
  --accent:#f97316; --red:#ef4444; --text:#e2e8f0; --muted:#64748b;
}
body {
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  padding: 1rem;
}
.box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 2.25rem 1.75rem 1.75rem;
  width: 100%; max-width: 340px;
}
.brand {
  text-align: center; font-size: 1.05rem; font-weight: 800;
  color: var(--accent); letter-spacing: .03em; margin-bottom: .2rem;
}
.sub {
  text-align: center; font-size: .72rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: .12em; margin-bottom: 1.5rem;
}
.display {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; height: 60px; display: flex;
  align-items: center; justify-content: center;
  font-size: 1.7rem; letter-spacing: .5rem; color: var(--accent);
  margin-bottom: .6rem;
}
.err {
  text-align: center; font-size: .82rem; color: var(--red);
  min-height: 1.2rem; margin-bottom: .8rem; font-weight: 600;
}
.grid { display: grid; grid-template-columns: repeat(3,1fr); gap: .7rem; }
.key {
  background: var(--key); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-size: 1.55rem;
  font-weight: 600; height: 64px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; user-select: none;
  display: flex; align-items: center; justify-content: center;
  transition: background .1s, transform .07s;
}
.key:active { background: #2e3347; transform: scale(.93); }
.key.clear { color: var(--red); font-size: .95rem; font-weight: 700; }
.key.enter { background: var(--accent); color: #fff; font-size: .95rem; font-weight: 700; }
.key.enter:active { opacity: .8; transform: none; }
</style>

<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boom Gate">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">


<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boom Gate">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/app-mobile.css">
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/static/sw.js").catch(()=>{}));
}
</script>

</head>
<body>
<div class="box">
  <div class="brand">RJL COMMERCIAL</div>
  <div class="sub">Boom Gate Admin</div>

  <div class="display"><span id="disp">——</span></div>
  <div class="err">{{ error or '' }}</div>

  <form method="post" id="loginForm">
    <input type="hidden" name="pin" id="pinField">
  </form>

  <div class="grid">
    <button type="button" class="key" onclick="press('1')">1</button>
    <button type="button" class="key" onclick="press('2')">2</button>
    <button type="button" class="key" onclick="press('3')">3</button>
    <button type="button" class="key" onclick="press('4')">4</button>
    <button type="button" class="key" onclick="press('5')">5</button>
    <button type="button" class="key" onclick="press('6')">6</button>
    <button type="button" class="key" onclick="press('7')">7</button>
    <button type="button" class="key" onclick="press('8')">8</button>
    <button type="button" class="key" onclick="press('9')">9</button>
    <button type="button" class="key clear" onclick="press('C')">CLR</button>
    <button type="button" class="key" onclick="press('0')">0</button>
    <button type="button" class="key enter" onclick="login()">LOGIN</button>
  </div>
</div>

<script>
let pin = '';
const disp  = document.getElementById('disp');
const field = document.getElementById('pinField');
const form  = document.getElementById('loginForm');

function render() {
  disp.textContent = pin.length ? '●'.repeat(pin.length) : '——';
}
function press(k) {
  if (k === 'C') { pin = ''; render(); return; }
  if (pin.length < 10) { pin += k; render(); }
}
function login() {
  if (!pin.length) return;
  field.value = pin;
  form.submit();
}
// allow hardware keyboard too
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') press(e.key);
  else if (e.key === 'Enter') login();
  else if (e.key === 'Backspace') { pin = pin.slice(0, -1); render(); }
});
render();
</script>
</body>
</html>
