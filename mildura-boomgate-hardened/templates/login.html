<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login • Mildura Boom Gate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fc; min-height: 100vh; }
    .card { max-width: 380px; margin: 12vh auto; box-shadow: 0 10px 35px rgba(0,0,0,0.08); border: 1px solid #e9ecef; border-radius: 16px; }
    .pin-input { font-size: 2rem; letter-spacing: 0.6rem; text-align: center; }
    .brand { font-weight: 700; letter-spacing: -.5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="brand">Mildura Working Man's Club</h1>
          <p class="text-muted mb-0">Boom Gate Controller</p>
        </div>

        {% if error %}
          <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label text-muted">Admin PIN</label>
            <input type="password" name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8"
                   class="form-control form-control-lg pin-input"
                   placeholder="••••••" autofocus required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">Unlock Dashboard</button>
        </form>

        <div class="text-center mt-4">
          <a href="{{ url_for('keypad') }}" class="text-muted small text-decoration-none">
            Staff keypad entry →
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
